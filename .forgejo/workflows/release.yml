name: release

on:
  push:
    tags:
      - "*-conv.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-24.04

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_ROOT: /opt/dotnet
      GODOT_FORK_PACKAGE_SUFFIX: conv.1

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential mingw-w64 scons python3 python3-pip \
            zip unzip curl git ca-certificates
          update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install .NET SDK
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir /opt/dotnet
          echo "/opt/dotnet" >> "$GITHUB_PATH"

      - name: Derive version info
        id: ver
        run: |
          GODOT_VERSION=$(python3 -c "d={}; exec(open('version.py').read(), d); print(f\"{d['major']}.{d['minor']}.{d['patch']}\")")
          TAG="${GITHUB_REF_NAME}"
          CONV_SUFFIX="${TAG#${GODOT_VERSION}-}"
          echo "godot_version=${GODOT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "conv_suffix=${CONV_SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "GODOT_FORK_PACKAGE_SUFFIX=${CONV_SUFFIX}" >> "$GITHUB_ENV"

      - name: Generate Mono glue (from upstream Linux editor)
        run: |
          GV="${{ steps.ver.outputs.godot_version }}"
          cd /tmp
          curl -sSL -o godot-linux.zip \
            "https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_mono_linux_x86_64.zip"
          unzip -q godot-linux.zip -d godot-linux
          cd "$GITHUB_WORKSPACE"
          /tmp/godot-linux/Godot_v${GV}-stable_mono_linux_x86_64/Godot_v${GV}-stable_mono_linux.x86_64 \
            --headless --generate-mono-glue modules/mono/glue

      - name: Build Windows editor
        run: |
          scons platform=windows target=editor module_mono_enabled=yes \
            use_mingw=yes d3d12=no accesskit=no debug_symbols=no -j$(nproc)

      - name: Build Windows export templates
        run: |
          scons platform=windows target=template_debug module_mono_enabled=yes \
            use_mingw=yes d3d12=no accesskit=no debug_symbols=no -j$(nproc)
          scons platform=windows target=template_release module_mono_enabled=yes \
            use_mingw=yes d3d12=no accesskit=no debug_symbols=no -j$(nproc)

      - name: Build .NET assemblies and pack nupkgs
        run: |
          export PATH=/opt/dotnet:$PATH
          mkdir -p /tmp/nupkgs-out
          python3 modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin --push-nupkgs-local /tmp/nupkgs-out

      - name: Push nupkgs to Forgejo package registry
        env:
          NUGET_URL: https://forgejo.matelq.ru/api/packages/CrackTower/nuget/index.json
          NUGET_API_KEY: ${{ secrets.CRACKTOWER_NUGET_API_KEY }}
        run: |
          export PATH=/opt/dotnet:$PATH
          for pkg in /tmp/nupkgs-out/*.nupkg; do
            dotnet nuget push "$pkg" --source "$NUGET_URL" --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Package editor zip and templates tpz
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          RELEASE="Godot_v${TAG}_mono_win64"
          cd bin
          mkdir -p /tmp/package/$RELEASE
          cp godot.windows.editor.x86_64.mono.exe /tmp/package/$RELEASE/$RELEASE.exe
          cp godot.windows.editor.x86_64.mono.console.exe /tmp/package/$RELEASE/${RELEASE}_console.exe
          cp -r GodotSharp /tmp/package/$RELEASE/GodotSharp
          cd /tmp/package && zip -rq $RELEASE.zip $RELEASE

          mkdir -p /tmp/package/templates
          echo "${{ steps.ver.outputs.godot_version }}.stable.mono" > /tmp/package/templates/version.txt
          cp "$GITHUB_WORKSPACE/bin/godot.windows.template_debug.x86_64.mono.exe" /tmp/package/templates/windows_debug_x86_64.exe
          cp "$GITHUB_WORKSPACE/bin/godot.windows.template_debug.x86_64.mono.console.exe" /tmp/package/templates/windows_debug_x86_64_console.exe
          cp "$GITHUB_WORKSPACE/bin/godot.windows.template_release.x86_64.mono.exe" /tmp/package/templates/windows_release_x86_64.exe
          cp "$GITHUB_WORKSPACE/bin/godot.windows.template_release.x86_64.mono.console.exe" /tmp/package/templates/windows_release_x86_64_console.exe
          cd /tmp/package && zip -rq Godot_v${TAG}_mono_export_templates.tpz templates

          sha256sum /tmp/package/$RELEASE.zip /tmp/package/Godot_v${TAG}_mono_export_templates.tpz

      - name: Create Forgejo release and upload assets
        env:
          FORGEJO_TOKEN: ${{ secrets.GODOT_RELEASE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          API=https://forgejo.matelq.ru/api/v1/repos/CrackTower/Godot
          RELEASE_ID=$(curl -sf -X POST "$API/releases" \
            -H "Authorization: token $FORGEJO_TOKEN" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false}" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          for f in /tmp/package/Godot_v${TAG}_mono_win64.zip /tmp/package/Godot_v${TAG}_mono_export_templates.tpz; do
            curl -sf -X POST "$API/releases/$RELEASE_ID/assets?name=$(basename $f)" \
              -H "Authorization: token $FORGEJO_TOKEN" \
              -F "attachment=@$f"
          done
